[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wireless-comm"
version = "0.1.0"
description = "Structured point-to-point communication runtime for Wi-Fi networks"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "WirelessComm contributors" }]
keywords = ["wifi", "communication", "asyncio", "p2p", "embodied-ai", "benchmark"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Networking",
]
dependencies = [
    "msgpack>=1.0",
    "PyYAML>=6.0",
    "typing-extensions>=4.0",
]

[project.optional-dependencies]
tensor = ["torch>=2.6"]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/BUAA-CI-LAB/WirelessComm"
Repository = "https://github.com/BUAA-CI-LAB/WirelessComm"
Issues = "https://github.com/BUAA-CI-LAB/WirelessComm/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
